name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose: action-setup errors out when the version
      # is given both here and as `packageManager` in package.json, and
      # package.json is the copy every local install already obeys.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Validate the reference manifests against real data
        run: |
          node packages/cli/dist/bin.js validate examples/sales-overview.gw.yaml --data
          node packages/cli/dist/bin.js validate examples/orders-star.gw.yaml --data

      - name: Build the playground
        run: pnpm --filter @gridwright/playground build
