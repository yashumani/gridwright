name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege. Nothing here writes to the repository, and a workflow that
# cannot write is a workflow a contributor's pull request cannot turn into
# something else.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to point
      # at different code, and then CI is running something nobody reviewed.
      # Dependabot keeps these current — see .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` here on purpose: action-setup errors out when the version
      # is given both here and as `packageManager` in package.json, and
      # package.json is the copy every local install already obeys.
      #
      # Upstream tagged one commit as v4.4.0, v5.0.0 and v5, so this pin is all
      # three at once and the version comment cannot narrow it. The commit is
      # what is being trusted here, which is the point of pinning to one.
      # Held at v5. v6 spends ~85s npm-installing the latest pnpm and then
      # downgrading to the version `packageManager` pins, and `standalone: true`
      # was slower still — measured at over 2m46s. v5 does the job in ~2s.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 == v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Validate the reference manifests against real data
        run: |
          node packages/cli/dist/bin.js validate examples/sales-overview.gw.yaml --data
          node packages/cli/dist/bin.js validate examples/orders-star.gw.yaml --data
          node packages/cli/dist/bin.js validate examples/chart-types.gw.yaml --data

      - name: Build the playground
        run: pnpm --filter @gridwright/playground build
