name: Release

# Manual on purpose. Publishing is a one-way door — a version that reaches npm
# cannot be taken back, only deprecated — so it needs somebody to decide, not a
# tag push to decide for them.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and check without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      # Held at v5. v6 spends ~85s npm-installing the latest pnpm and then
      # downgrading to the version `packageManager` pins, and `standalone: true`
      # was slower still — measured at over 2m46s. v5 does the job in ~2s.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 == v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Everything CI runs, again. A release is the worst possible time to find
      # out the build was only green on somebody's laptop.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Validate the reference manifests against real data
        run: |
          node packages/cli/dist/bin.js validate examples/sales-overview.gw.yaml --data
          node packages/cli/dist/bin.js validate examples/orders-star.gw.yaml --data
          node packages/cli/dist/bin.js validate examples/chart-types.gw.yaml --data

      # Packing and consumer qualification need neither npm credentials nor a
      # protected environment. The same checks gate a real publish below.
      - name: Verify distributables in a clean consumer
        run: pnpm verify:consumer --no-browser

  publish:
    if: ${{ !inputs.dry-run }}
    needs: qualification
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write       # npm provenance: proves the tarball came from this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 == v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # Both jobs check out the event's immutable commit, so this rebuild
      # publishes the source that passed qualification even if the branch moves.
      - name: Build
        run: pnpm build

      # Read-only, and it runs before every publish for one reason: a recursive
      # publish is not atomic. If the token cannot write the scope, some
      # packages land and the rest 403, leaving a half-released version that
      # cannot be taken back -- a version is immutable and a name is claimed
      # permanently. Better to fail here, having published nothing.
      #
      # `npm whoami` is the hard gate: a bad or expired token stops the job.
      # The scope check only reports, because a scope with no packages yet
      # answers differently from one that already has some, and a user-owned
      # scope is not an organization at all.
      - name: Preflight — is the token valid, and can it write the scope?
        run: |
          echo "authenticated as: $(npm whoami)"
          for scope in $(node -e "
            const fs = require('node:fs');
            const scopes = new Set();
            for (const dir of fs.readdirSync('packages')) {
              const { name } = JSON.parse(fs.readFileSync('packages/' + dir + '/package.json'));
              if (name.startsWith('@')) scopes.add(name.split('/')[0]);
            }
            console.log([...scopes].join(' '));
          "); do
            echo "--- $scope ---"
            npm access list packages "$scope" 2>&1 | head -5 || true
            npm org ls "${scope#@}" 2>&1 | head -5 || true
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
