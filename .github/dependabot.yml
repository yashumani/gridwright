version: 2
updates:
  # Pinned action SHAs only stay safe if something keeps them current; this is
  # the other half of that decision.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    ignore:
      # pnpm/action-setup is held at v5 on purpose, and the reason is measured
      # rather than a preference: v6 spends ~85s npm-installing the latest pnpm
      # and then downgrading to the version `packageManager` already pins, and
      # `standalone: true` came in over 2m46s. v5 does the same job in ~2s.
      # Dependabot's bump kept the "held at v5" comment while changing the SHA
      # underneath it, which is worse than either choice on its own.
      - dependency-name: "pnpm/action-setup"
        versions: [">=6"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR for the routine noise, so review attention goes to the ones that
      # actually change behaviour.
      dev-minor:
        dependency-type: development
        update-types: ["minor", "patch"]
